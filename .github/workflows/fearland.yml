# Bootstrap caller for repositories created from the public template.
# After creating the repository, run `tools/fl ci sync <repo>` from the private
# FearLand meta workspace. That replaces this bootstrap reference with the
# current pinned shared-CI revision.
name: fearland

on:
  push:
  pull_request:

concurrency:
  group: fearland-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: FearServers/fearland/.github/workflows/plugin-ci.yml@main
    permissions:
      contents: read
    with:
      meta_ref: main
      artifacts: |
        fearland-example=fearland-example
      siblings: |

    # The shared workflow receives the standard FearLand repository secrets.
    # `fl ci sync` keeps this contract identical to active plugin repositories.
    secrets: inherit
